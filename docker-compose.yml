services:
  nomo-web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_PUBLIC_APP_ORIGIN: ${VITE_PUBLIC_APP_ORIGIN}
    image: nomo-web:latest
    ports:
      - "${NOMO_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
