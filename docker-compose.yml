services:
  nomo-web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_PUBLIC_APP_ORIGIN: ${VITE_PUBLIC_APP_ORIGIN}
    image: nomo-web:latest
    ports:
      - "${NOMO_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
  nomo-packing-worker:
    profiles: ["packing"]
    build:
      context: .
      dockerfile: apps/packing-worker/Dockerfile
    image: nomo-packing-worker:latest
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      QWEN_API_KEY: ${QWEN_API_KEY}
      QWEN_OPENAI_BASE_URL: ${QWEN_OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_VL_MODEL: ${QWEN_VL_MODEL:-qwen3-vl-plus-2025-12-19}
      PACKING_WORKER_POLL_MS: ${PACKING_WORKER_POLL_MS:-3000}
      PACKING_WORKER_BATCH_SIZE: ${PACKING_WORKER_BATCH_SIZE:-2}
